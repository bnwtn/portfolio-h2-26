<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Page not found — Billy Newton</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/img/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Billy Newton · Portfolio 2027 · 404
   Figma dMo29uEcxFJ2nu3MstY7xy: 570:18127 (rest) and 570:17958 (idle).
   The 404 lockup sits on a 1920x1080 stage scaled by --u; corner text
   stays pinned to the viewport. After IDLE_MS without input the six
   skill tags drop in under gravity and pile up; they can be grabbed and thrown.
   ============================================================ */
:root{
  --u: min(100vw / 1400, 100svh / 1080);   /* 1 Figma px on the stage */
  --edge: 40px;
  --ease: cubic-bezier(.22,1,.36,1);
}
@media (max-width: 700px){ :root{ --edge: 20px } }
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#000; color:#fff; overflow:hidden;
  font-family:Inter, system-ui, sans-serif; font-weight:500;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
.trim{text-box:trim-both cap alphabetic}

/* ---------- corners ---------- */
.corner{position:fixed; z-index:2; font-size:15px; line-height:1.1; letter-spacing:-.03em}
.crumb{left:var(--edge); top:43px; font-weight:600}
.call{right:var(--edge); top:43px; text-align:right}
.call a:hover{opacity:.6}
.call a{transition:opacity .3s var(--ease)}
.sign{left:29px; bottom:32px}
.sign .mark{display:block; width:50px; height:83px; margin:0 0 26px -2px}
.sign .mark img{display:block; width:49.92px; height:82.91px}
.sign p{margin:0; position:relative; width:186px; text-align:right; font-size:18.9px; line-height:1; letter-spacing:-.04em}
.sign .no{position:absolute; left:0; bottom:0; color:#ff591a}
@media (max-width: 700px){ .crumb,.call{top:24px} .sign{left:18px; bottom:20px} }

/* ---------- stage ---------- */
.stage{position:fixed; left:50%; top:50%; width:calc(1920 * var(--u)); height:calc(1080 * var(--u)); translate:-50% -50%; pointer-events:none}
.stage > *{position:absolute}
.four{
  top:calc(526.62 * var(--u)); translate:calc(-50% - 10.7 * var(--u)) -50%; /* trailing -.04em tracking shifts the box */
  font-size:calc(535.04 * var(--u)); letter-spacing:-.04em; line-height:1; white-space:nowrap;
}
@supports not (text-box: trim-both cap alphabetic){ .four{line-height:.727} }
.four.l{left:calc(514.5 * var(--u))}
.four.r{left:calc(1405.3 * var(--u))}
.zero{left:calc(694.56 * var(--u)); top:calc(271 * var(--u)); width:calc(537.48 * var(--u)); height:calc(537.48 * var(--u))}
.zero img{position:absolute; left:calc(2 * var(--u)); top:calc(10.17 * var(--u)); width:calc(523.64 * var(--u)); height:calc(523.69 * var(--u))}
.lost{
  left:calc(955.64 * var(--u)); top:calc(871 * var(--u)); translate:-50% 0; white-space:nowrap;
  font-size:max(calc(29.49 * var(--u)), 17px); letter-spacing:-.04em; line-height:1;
}
.lost a{pointer-events:auto; transition:opacity .3s var(--ease)}
.lost a:hover{opacity:.6}

/* gentle breathing on the bubble zero */
@media (prefers-reduced-motion: no-preference){
  .zero img{animation:breathe 9s ease-in-out infinite}
  @keyframes breathe{ 50%{transform:rotate(8deg) scale(1.015)} }
}

/* ---------- skill tags ---------- */
.tags{position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden}
.tag{
  position:absolute; left:0; top:0; pointer-events:auto; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none;
  padding:var(--tp); border-radius:var(--tr); white-space:nowrap;
  font-size:var(--tf); line-height:.86; letter-spacing:-.02em;
  background:var(--bg); color:var(--fg);
  visibility:hidden; will-change:transform;
  --tf:max(calc(47.71 * var(--u)), 20px);
  --tp:calc(var(--tf) * .5634);            /* 26.88 / 47.71 */
  --tr:calc(var(--tf) * .2465);            /* 11.76 / 47.71 */
}
.tag span{display:block}
.tag.drag{cursor:grabbing}
.tag.on{visibility:visible}
/* static fallback (reduced motion / no physics): the Figma idle frame */
.tags.static .tag{visibility:visible; translate:-50% -50%; opacity:0; transition:opacity .6s var(--ease); left:var(--x); top:var(--y); rotate:var(--r); cursor:default}
.tags.static.show .tag{opacity:var(--o, 1)}
</style>
</head>
<body>

<div class="corner crumb"><span class="trim">/404</span></div>
<div class="corner call"><a class="trim" href="tel:+447534872153">Call me maybe?<br>+44 (0) 7534 872 153</a></div>
<div class="corner sign">
  <a class="mark" href="/" aria-label="Back to the homepage"><img src="/img/404-mark-8.svg" alt="" width="49.92" height="82.91"></a>
  <p>Fedrigoni 365 –– 2027<br>Organic<span class="no">#8</span></p>
</div>

<main class="stage" aria-label="404, page not found">
  <span class="four l trim" aria-hidden="true">4</span>
  <div class="zero" aria-hidden="true"><img src="/img/404-zero.svg" alt="" width="523.64" height="523.69"></div>
  <span class="four r trim" aria-hidden="true">4</span>
  <h1 class="lost trim" style="margin:0; font-weight:500"><a href="/">Page not found</a></h1>
</main>

<!-- --x/--y/--r: placement in the Figma idle frame, used only by the static fallback -->
<div class="tags" id="tags" aria-hidden="true">
  <div class="tag" style="--bg:#f55213; --fg:rgba(255,255,255,.4); --x:11.3%; --y:90.5%; --r:15deg"><span class="trim">Design Systems</span></div>
  <div class="tag" style="--bg:#bbff00; --fg:#fff;               --x:53.4%; --y:89.1%; --r:-19deg"><span class="trim">User Experience</span></div>
  <div class="tag" style="--bg:#1b1b1b; --fg:rgba(255,255,255,.4); --o:.9; --x:69.4%; --y:81.7%; --r:-60deg"><span class="trim">Product Design</span></div>
  <div class="tag" style="--bg:#0509fa; --fg:rgba(255,255,255,.4); --x:77.0%; --y:92.5%; --r:-14deg"><span class="trim">Strategy</span></div>
  <div class="tag" style="--bg:#ff1ad1; --fg:rgba(0,0,0,.2);       --x:87.2%; --y:85.0%; --r:42deg"><span class="trim">Visual Design</span></div>
  <div class="tag" style="--bg:#181818; --fg:#6a6a6a;              --x:93.6%; --y:80.9%; --r:13deg"><span class="trim">Motion</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js" defer></script>
<script>
addEventListener('DOMContentLoaded', () => {
  const IDLE_MS = 5000;
  const layer = document.getElementById('tags');
  const els = [...layer.children];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dropped = false, timer;

  const idle = () => { clearTimeout(timer); if (!dropped) timer = setTimeout(drop, IDLE_MS); };
  ['pointermove','pointerdown','keydown','wheel','touchstart'].forEach(t => addEventListener(t, idle, {passive:true}));
  idle();

  function drop(){
    dropped = true;
    if (reduce || !window.Matter){
      layer.classList.add('static');
      requestAnimationFrame(() => layer.classList.add('show'));
      return;
    }
    physics();
  }

  function physics(){
    const {Engine, Bodies, Body, Composite, Constraint} = Matter;
    const engine = Engine.create({gravity:{y:1.1}});
    const W = () => innerWidth, H = () => innerHeight, T = 400;
    let walls = [];
    const buildWalls = () => {
      Composite.remove(engine.world, walls);
      walls = [
        Bodies.rectangle(W()/2, H() + T/2, W() * 3, T, {isStatic:true}),
        Bodies.rectangle(-T/2, H()/2 - H(), T, H() * 4, {isStatic:true}),
        Bodies.rectangle(W() + T/2, H()/2 - H(), T, H() * 4, {isStatic:true}),
      ];
      Composite.add(engine.world, walls);
    };
    buildWalls();

    // shuffle the drop order so it reads differently every time
    const order = els.map((el, i) => ({el, k:Math.random()})).sort((a, b) => a.k - b.k).map(o => o.el);
    const items = order.map((el, i) => {
      const w = el.offsetWidth, h = el.offsetHeight;
      const r = parseFloat(getComputedStyle(el).borderRadius) || 0;
      const x = w/2 + Math.random() * Math.max(1, W() - w);
      const b = Bodies.rectangle(x, -h - 40, w, h, {
        chamfer:{radius:Math.min(r, h/2 - 1)}, restitution:.25, friction:.5, frictionAir:.012, density:.0015,
        angle:(Math.random() - .5) * 1.1,
      });
      Body.setInertia(b, b.inertia * 4);               // resist flipping, so labels land readable
      Body.setAngularVelocity(b, (Math.random() - .5) * .03);
      return {el, b, w, h, at: i * 260};
    });
    const start = performance.now();
    items.forEach(it => setTimeout(() => { Composite.add(engine.world, it.b); it.el.classList.add('on'); }, it.at));

    // grab and throw
    let grab = null;
    items.forEach(it => it.el.addEventListener('pointerdown', e => {
      const p = {x:e.clientX, y:e.clientY};
      const local = Matter.Vector.rotate(Matter.Vector.sub(p, it.b.position), -it.b.angle);
      grab = {it, c: Constraint.create({pointA:p, bodyB:it.b, pointB:Matter.Vector.rotate(local, it.b.angle), stiffness:.2, damping:.1, length:0})};
      Composite.add(engine.world, grab.c);
      it.el.classList.add('drag');
      it.el.setPointerCapture(e.pointerId);
    }));
    addEventListener('pointermove', e => { if (grab) grab.c.pointA = {x:e.clientX, y:e.clientY}; });
    const release = () => { if (!grab) return; Composite.remove(engine.world, grab.c); grab.it.el.classList.remove('drag'); grab = null; };
    addEventListener('pointerup', release); addEventListener('pointercancel', release);

    addEventListener('resize', () => {
      buildWalls();
      items.forEach(({b, w, h}) => {   // keep everything on screen
        const x = Math.min(Math.max(b.position.x, w/2), W() - w/2), y = Math.min(b.position.y, H() - h/2);
        if (x !== b.position.x || y !== b.position.y) Body.setPosition(b, {x, y});
      });
    });

    let last = performance.now();
    (function tick(now){
      Engine.update(engine, Math.min(now - last, 32)); last = now;
      for (const {el, b, w, h} of items){
        el.style.transform = `translate(${b.position.x - w/2}px, ${b.position.y - h/2}px) rotate(${b.angle}rad)`;
      }
      requestAnimationFrame(tick);
    })(last);
  }
});
</script>
</body>
</html>
